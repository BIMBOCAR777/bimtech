<style>

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@400;600&display=swap');

  :root{
    --bg:#0f1724;
    --card:#0b1220;
    --muted:#97a0b5;
    --accent:#6ee7b7;
    --glass: rgba(255,255,255,0.04);
  }

  /* apply a subtle dark gradient background while keeping your existing layout */
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: radial-gradient(1200px 400px at 10% 10%, rgba(110,231,183,0.06), transparent 10%),
                radial-gradient(900px 300px at 95% 80%, rgba(99,102,241,0.04), transparent 10%),
                linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    color: #0f1724;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* wrapper */
  .profile-card{
    max-width: 920px;
    margin: 2.5rem auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.85));
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 6px 30px rgba(16,24,40,0.08);
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 1.5rem;
    align-items: center;
  }

  /* portrait */
  .avatar{
    width: 180px;
    height: 180px;
    border-radius: 14px;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg,#eef2ff,#e6fffa);
    box-shadow: 0 8px 24px rgba(16,24,40,0.06);
    flex-shrink:0;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }

  /* header */
  .hero-title{
    font-family: "Space Grotesk", "Inter", sans-serif;
    font-weight:600;
    font-size: clamp(1.6rem, 2.6vw, 2.25rem);
    margin:0;
    color: #0b1220;
  }
  .hero-sub{
    margin-top:6px;
    color: var(--muted);
    font-weight:500;
    font-size: 0.98rem;
  }

  /* actions */
  .actions{ margin-top: 12px; display:flex; gap:0.6rem; flex-wrap:wrap; }
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:0.55rem 0.9rem; border-radius:999px;
    background:linear-gradient(90deg,#4f46e5,#06b6d4);
    color:white; font-weight:600; font-size:0.95rem; text-decoration:none;
    box-shadow: 0 6px 18px rgba(99,102,241,0.14);
  }
  .btn.secondary {
    background: transparent; color: #0b1220; border:1px solid rgba(11,18,32,0.06);
    box-shadow:none;
  }

  /* presentation + skills */
  .content {
    padding-top: 0.4rem;
  }
  .section {
    margin-top: 1.15rem;
    background: var(--glass);
    padding: 1rem;
    border-radius: 10px;
  }
  .section h3{
    margin:0; font-size:1rem; font-weight:600; color:#0b1220;
  }
  .lead{
    margin-top:0.6rem; color: #334155; line-height:1.5; font-size:0.98rem;
  }

  /* quote */
  .quote {
    margin-top:0.8rem; padding:0.9rem; border-radius:8px;
    background: linear-gradient(90deg,#eef2ff,#f0f9ff);
    border-left: 3px solid #60a5fa;
    color:#075985;
    font-weight:500;
  }

  /* skills grid */
  .skills-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap:0.75rem;
    margin-top:0.7rem;
  }
  .skill {
    background: white;
    padding:0.75rem;
    border-radius:10px;
    box-shadow: 0 6px 18px rgba(10,14,20,0.04);
    display:flex; align-items:flex-start; gap:0.75rem;
  }
  .skill svg{ width:36px; height:36px; flex-shrink:0; margin-top:4px; }
  .skill h4{ margin:0; font-size:0.98rem; font-weight:600; color:#0b1220; }
  .skill p{ margin:0; color:var(--muted); font-size:0.86rem; margin-top:6px; }

  /* footer */
  .meta {
    margin-top:1rem; display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap;
    color:var(--muted); font-size:0.92rem;
  }

  /* subtle enter animation */
  .fade-in { opacity:0; transform: translateY(10px) scale(0.998); animation: fadeUp 700ms ease forwards; }
  @keyframes fadeUp {
    to { opacity:1; transform:none; }
  }

  @media (max-width:820px){
    .profile-card{ grid-template-columns: 1fr; padding:1.2rem; gap:1rem; }
    .avatar{ margin:0 auto; width:140px; height:140px; }
    .actions{ justify-content:center; }
    .meta{ justify-content:center; }
  }
</style>

<script>
  (function(){

              <img src="icons/tiktok-svgrepo-com.svg" alt="" style="width:16px;height:16px;margin-right:8px;vertical-align:text-bottom;">
              TikTok

              <a class="btn secondary" href="https://www.linkedin.com/in/bocar-ibrahim-toure-ba9661275?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=ios_app" target="_blank" rel="noopener">LinkedIn</a>

                </svg>
                <div>
                  <h4>Progressive Web Apps</h4>
                  <p>PWA rapides & offline-first, service workers, mises en cache intelligentes.</p>
                </div>
              </article>

              <article class="skill" role="listitem">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 3v18" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>

                </div>
              </article>

              <article class="skill" role="listitem">

                </svg>
                <div>
                  <h4>Solutions sur-mesure</h4>
                  <p>Applications métiers pour simplifier la gestion et automatiser les processus.</p>
                </div>
              </article>
            </div>

            <p class="meta">Disponible pour freelance · Études de cas & code sur demande · <span id="last-updated"></span></p>
          </section>
        </div>
      </div>
    `;
    section.innerHTML = html;

    // set last updated date
    const el = document.getElementById('last-updated');
    if(el) el.textContent = 'Dernière mise à jour : ' + new Date().toLocaleDateString();

    // small interaction: copy email to clipboard on long press / double click
    const contactBtn = document.getElementById('contactMail');
    if(contactBtn){
      contactBtn.addEventListener('contextmenu', function(e){
        e.preventDefault();
        const email = 'contact@bocaribrahim17@gmail.com';
        navigator.clipboard?.writeText(email).then(()=> {
          const original = contactBtn.textContent;
          contactBtn.textContent = 'Email copié ✔';
          setTimeout(()=> contactBtn.textContent = original, 1400);
        });
      });
    }

    // enable smooth scrolling for internal links (if any)
    if('scrollBehavior' in document.documentElement.style){
      document.documentElement.style.scrollBehavior = 'smooth';
    }
  })();
</script>
